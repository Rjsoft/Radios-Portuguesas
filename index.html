const store = {

  set(key, value) { try { localStorage.setItem("radiospt." + key, JSON.stringify(value)); } catch {} },

const storedFavorites = store.get("favorites", []);

let volume = Number(store.get("volume", 80));
volume = Number.isFinite(volume) ? Math.min(100, Math.max(0, Math.round(volume))) : 80;
let muted = store.get("muted", false) === true;
let filter = "all";

/* ---------- Utilitários ---------- */
const $ = (id) => document.getElementById(id);
const normalize = (s) => (s || "").toString().normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
function initials(name) {
  const words = name.split(/\s+/);
  if (words.length === 1 || /\d/.test(words[0])) return words[0].slice(0, 3).toUpperCase(); // TSF, M80
  return words.map((w) => w[0]).join("").slice(0, 3).toUpperCase();                        // RC
}
function avatarColor(id) { let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) % 360; return `hsl(${h} 45% 38%)`; }
// Preenche um avatar com o logo da rádio; se não houver logo (ou falhar), usa as iniciais.
function paintAvatar(av, station) {
  const showInitials = () => {
    av.classList.remove("has-logo");
    av.textContent = initials(station.name);
    av.style.background = avatarColor(station.id);
  };
  if (!station.logo) return showInitials();
  const img = document.createElement("img");
  img.src = station.logo;
  img.alt = "";
  img.loading = "lazy";
  img.onerror = showInitials;
  av.classList.add("has-logo");
  av.style.background = "";
  av.replaceChildren(img);
}
function describe(s) { return [s.city, s.region].filter(Boolean).filter((v, i, a) => a.indexOf(v) === i).join(" · ") || "Portugal"; }
function techInfo(s) { return [s.codec, s.bitrate && s.bitrate + " kbps"].filter(Boolean).join(" · "); }

function matches(card) {
  const s = card.station;
  if (filter === "fav" && !favorites.has(s.id)) return false;
  if (filter !== "all" && filter !== "fav" && s.category !== filter) return false;
  return !query || card.hay.includes(query);
}

/* ---------- Tema ---------- */
const themeMedia = window.matchMedia("(prefers-color-scheme: dark)");
function applyTheme() {
  const dark = theme === "dark" || (theme === "system" && themeMedia.matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  const label = { system: "Sistema", light: "Claro", dark: "Escuro" }[theme];
  $("themeBtn").textContent = { system: "🖥", light: "☀", dark: "🌙" }[theme] + " " + label;
  $("themeBtn").setAttribute("aria-label", `Tema: ${label}. Mudar tema`); // inclui o texto visível (WCAG 2.5.3)
}
$("themeBtn").onclick = () => { theme = { system: "light", light: "dark", dark: "system" }[theme]; store.set("theme", theme); applyTheme(); };
themeMedia.addEventListener("change", applyTheme);

/* ---------- Player (um único stream de cada vez) ---------- */
const audio = $("audio");
let current = null;   // estação selecionada
let status = "idle";  // idle | loading | playing | paused | error
const CONNECT_TIMEOUT_MS = 15000; // tempo máximo em "A ligar…" antes de mostrar erro
let connectTimer;
let playAttempt = 0; // identifica a tentativa atual e ignora erros de tentativas anteriores
let hlsInstance = null;
let hlsScriptPromise = null;
const HLS_LIBRARY_URL = "https://cdn.jsdelivr.net/npm/hls.js@1.7.4/dist/hls.min.js";
const HLS_LIBRARY_INTEGRITY = "sha384-p9vgU/7IYJWd3I4STrtqxqR/2cAQlhIX7D/HrTnIMEjjcUox165b7se7sxmm3zDg";

// Carrega a biblioteca apenas quando necessária (browsers sem HLS nativo).
function loadHlsLibrary() {
  if (window.Hls) return Promise.resolve(window.Hls);
  if (hlsScriptPromise) return hlsScriptPromise;
  hlsScriptPromise = new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = HLS_LIBRARY_URL;
    script.integrity = HLS_LIBRARY_INTEGRITY;
    script.crossOrigin = "anonymous"; // necessário para verificar SRI em recursos de outra origem
    script.async = true;
    script.onload = () => window.Hls ? resolve(window.Hls) : reject(new Error("Biblioteca HLS indisponível"));
    script.onerror = () => reject(new Error("Não foi possível carregar o suporte HLS"));
    document.head.append(script);
  }).catch((error) => {
    hlsScriptPromise = null; // permitir nova tentativa se o CDN estiver temporariamente indisponível
    throw error;
  });
  return hlsScriptPromise;
}

function showPlaybackError(message) {
  ++playAttempt; // rejeita callbacks assíncronos de uma reprodução que falhou
  stopStream();
  setStatus("error");
  if (message) $("pStatus").textContent = message;
}

function startConnectTimer() {
  clearTimeout(connectTimer);
  const attempt = playAttempt;
  connectTimer = setTimeout(() => {
    if (attempt === playAttempt && status === "loading") {
      showPlaybackError("A ligação demorou demasiado tempo. Tente novamente.");
    }
  }, CONNECT_TIMEOUT_MS);
}

function setStatus(next) {
  const previous = status;
  status = next;
  if (next !== "loading") clearTimeout(connectTimer);
  else if (previous !== "loading") startConnectTimer();
  const el = $("pStatus");
  el.classList.toggle("error", next === "error");
  // Só reescreve o texto quando o estado muda: evita anúncios repetidos no leitor de ecrã a cada buffering.
  if (next !== previous) {
    const text = {
      idle: "", loading: "A ligar…", playing: "Em direto", paused: "Em pausa",
      error: "Não foi possível ligar a esta rádio. O stream pode estar temporariamente indisponível.",
    }[next];
    el.replaceChildren(...(next === "playing" ? [liveDot(), text] : [text]));
  }
  $("pErrorActions").hidden = next !== "error";
  $("siteBtn").hidden = !(current && current.website);
  const playing = next === "playing" || next === "loading";
  $("pPlay").textContent = playing ? "⏸" : "▶";
  $("pPlay").setAttribute("aria-label", playing ? "Pausar" : "Reproduzir");
  $("pPlay").disabled = !current;
  updatePlayerCards();
  updateMediaSession();
}

// "🔴" decorativo, escondido dos leitores de ecrã (não é lido como "círculo vermelho").
function liveDot() {
  const dot = document.createElement("span");
  dot.textContent = "🔴 ";
  dot.setAttribute("aria-hidden", "true");
  return dot;
}

function stopStream() {
  if (hlsInstance) {
    hlsInstance.destroy();
    hlsInstance = null;
  }
  audio.pause();
  audio.removeAttribute("src");
  audio.load(); // liberta a ligação ao stream anterior
}

function play(station) {
  const attempt = ++playAttempt;
  stopStream();
  current = station;
  store.set("lastStationId", station.id);
  $("pName").textContent = station.name;
  paintAvatar($("pAvatar"), station);

  setStatus("loading");
  startConnectTimer(); // nova rádio: o prazo recomeça, mesmo que a anterior ainda estivesse a ligar

  const startAudio = () => {
    audio.play().catch((err) => {
      if (attempt !== playAttempt || err.name === "AbortError") return;
      // Alguns browsers exigem uma nova interação após o carregamento assíncrono do HLS.
      if (err.name === "NotAllowedError") {
        showPlaybackError("O navegador bloqueou o início automático do áudio. Toque em «Tentar novamente» para ouvir.");
      } else if (err.name === "NotSupportedError") {
        showPlaybackError("Este navegador não suporta o formato de áudio desta rádio.");
      } else {
        showPlaybackError("Não foi possível iniciar o áudio. Tente novamente.");
      }
    });
  };

  if (station.streamType !== "hls" || audio.canPlayType("application/vnd.apple.mpegurl")) {
    audio.src = station.streamUrl;
    startAudio();
    return;
  }

  // HLS sem suporte nativo: hls.js precisa de MediaSource e de CORS no servidor de origem.
  loadHlsLibrary().then((Hls) => {
    if (attempt !== playAttempt || current?.id !== station.id || status !== "loading") return;
    if (!Hls.isSupported()) {
      showPlaybackError("Este browser não suporta HLS. Abra o stream num leitor externo, como o VLC.");
      return;
    }
    const player = new Hls({ enableWorker: true });
    hlsInstance = player;
    player.on(Hls.Events.MANIFEST_PARSED, () => {
      if (attempt === playAttempt) startAudio();
    });
    player.on(Hls.Events.ERROR, (_event, data) => {
      if (attempt !== playAttempt || !data.fatal) return;
      // Metadados técnicos para diagnóstico sem expor parâmetros de URLs dos streams.
      console.warn("HLS fatal:", data.type, data.details, data.response?.code ?? "");
      showPlaybackError("A ligação HLS falhou. Tente novamente ou abra o site da rádio.");
    });
    player.loadSource(station.streamUrl);
    player.attachMedia(audio);
  }).catch(() => {
    if (attempt === playAttempt) showPlaybackError("Não foi possível carregar o suporte HLS. Verifique a ligação e tente novamente.");
  });
}

function togglePlay(station) {
  if (current && current.id === station.id && (status === "playing" || status === "loading")) {
    ++playAttempt; // invalida pedidos HLS/play() ainda pendentes
    audio.pause();
    stopStream();          // rádio em direto: ao retomar volta ao "agora"
    setStatus("paused");
  } else {
    play(station);
  }
}

audio.addEventListener("loadstart", () => { if (audio.getAttribute("src")) setStatus("loading"); });
audio.addEventListener("waiting", () => {
  if (current && (status === "playing" || status === "loading")) setStatus("loading");
});
audio.addEventListener("stalled", () => {
  if (current && (status === "playing" || status === "loading")) setStatus("loading");
});
audio.addEventListener("playing", () => {
  if (current && status === "loading") setStatus("playing");
});
audio.addEventListener("error", () => {
  if (current && (status === "playing" || status === "loading")) showPlaybackError();
});
// Pausa vinda de fora da app (chamada, auscultadores, teclas multimédia). As pausas pedidas pela
// própria app já mudaram o estado, ou o áudio já voltou a tocar (audio.paused === false).
audio.addEventListener("pause", () => { if (audio.paused && (status === "playing" || status === "loading")) setStatus("paused"); });
// Um stream em direto não deve terminar: se terminar, a ligação caiu.
audio.addEventListener("ended", () => {
  if (current && (status === "playing" || status === "loading")) showPlaybackError();
});

/* ---------- Ecrã de bloqueio / teclas multimédia (Media Session) ---------- */
const isBusy = () => status === "playing" || status === "loading";
const mediaActions = {
  play: () => { if (current && !isBusy()) play(current); },
  pause: () => { if (current && isBusy()) togglePlay(current); },
  stop: () => { if (current && isBusy()) togglePlay(current); },
};
let mediaStationId = null;
function updateMediaSession() {
  if (!("mediaSession" in navigator) || !current) return;
  if (mediaStationId !== current.id) { // metadados só mudam quando muda a rádio
    mediaStationId = current.id;
    const artwork = current.logo
      ? [{ src: new URL(current.logo, document.baseURI).href, sizes: "128x128", type: "image/png" }]
      : [{ src: new URL("icons/icon-512.png", document.baseURI).href, sizes: "512x512", type: "image/png" }];
    navigator.mediaSession.metadata = new MediaMetadata({ title: current.name, artist: "Rádios Portugal Live", album: "Em direto", artwork });
  }
  navigator.mediaSession.playbackState = isBusy() ? "playing" : status === "paused" ? "paused" : "none";
}
if ("mediaSession" in navigator) {
  for (const [action, handler] of Object.entries(mediaActions)) {
    try { navigator.mediaSession.setActionHandler(action, handler); } catch {} // ação não suportada neste browser
  }
}

$("pPlay").onclick = () => current && togglePlay(current);
$("retryBtn").onclick = () => current && play(current);
$("siteBtn").onclick = () => current && current.website && window.open(current.website, "_blank", "noopener");

/* ---------- Volume ---------- */
function applyVolume() {
  audio.volume = volume / 100;
  audio.muted = muted;
  $("vol").value = volume;
  $("muteBtn").textContent = muted || volume === 0 ? "🔇" : "🔊";
  // botão de alternar: nome fixo + aria-pressed (o estado é anunciado sem contradições)
  $("muteBtn").setAttribute("aria-label", "Silenciar");
  $("muteBtn").setAttribute("aria-pressed", String(muted));
}
// iOS ignora audio.volume (só o sistema controla o volume): nesse caso o slider não faz nada e é escondido.
const volumeIsControllable = (() => { const probe = new Audio(); probe.volume = 0.5; return probe.volume === 0.5; })();
$("vol").hidden = !volumeIsControllable;
$("vol").oninput = (e) => { volume = Number(e.target.value); muted = false; store.set("volume", volume); store.set("muted", muted); applyVolume(); };
$("muteBtn").onclick = () => { muted = !muted; store.set("muted", muted); applyVolume(); };

/* ---------- Copiar URL ---------- */
let toastTimer;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 2000); }
async function copyUrl(station) {
  try { await navigator.clipboard.writeText(station.streamUrl); toast("URL copiado"); }
  catch { window.prompt("Copie o URL do stream:", station.streamUrl); }
}

/* ---------- Interface ---------- */
// Filtros e cartões são criados uma única vez. Pesquisa e filtros apenas mostram/escondem cartões,
// e o leitor só atualiza os cartões afetados — o foco do teclado nunca se perde e escala para centenas de rádios.
const collator = new Intl.Collator("pt");
const cards = new Map(); // id -> { station, hay, li, statusEl, favBtn, playBtn }
let shownActiveId = null; // cartão atualmente marcado como ativo

function renderFilters() {
  $("filters").replaceChildren(...FILTERS.map(([key, label]) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label; b.dataset.filter = key;
    b.onclick = () => { filter = key; updateFilterButtons(); applyFilters(); };
    return b;
  }));
  updateFilterButtons();
}

function updateFilterButtons() {
  for (const b of $("filters").children) b.setAttribute("aria-pressed", String(b.dataset.filter === filter));
}

function el(tag, props = {}, children = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "attrs") for (const [a, av] of Object.entries(v)) e.setAttribute(a, av);
    else e[k] = v;
  }
  e.append(...children);
  return e;
}

function buildCards() {
  const fragment = document.createDocumentFragment();
  const list = STATIONS.filter((s) => s.enabled).sort((a, b) => collator.compare(a.name, b.name));
  for (const s of list) {
    const avatar = el("div", { className: "avatar", attrs: { "aria-hidden": "true" } });
    paintAvatar(avatar, s);
    const statusEl = el("span", { className: "meta", hidden: true });
    const favBtn = el("button", { type: "button", className: "icon-btn fav", onclick: () => toggleFavorite(s.id) });
    const playBtn = el("button", { type: "button", className: "play-btn", onclick: () => togglePlay(s) });
    const li = el("li", { className: "card" }, [
      el("div", { className: "card-top" }, [avatar, el("div", {}, [
        el("p", { className: "name", textContent: s.name }),
        el("p", { className: "meta", textContent: describe(s) + (s.frequency ? " · " + s.frequency : "") }),
      ])]),
      el("p", { className: "meta", textContent: [CATEGORY_LABELS[s.category], techInfo(s)].filter(Boolean).join(" · ") }),
      statusEl,
      el("div", { className: "actions" }, [
        favBtn,
        el("button", { type: "button", className: "icon-btn", textContent: "⧉", title: "Copiar URL do stream",
          attrs: { "aria-label": "Copiar URL do stream: " + s.name }, onclick: () => copyUrl(s) }),
        playBtn,
      ]),
    ]);
    const hay = normalize([s.name, s.city, s.region, s.frequency, CATEGORY_LABELS[s.category], s.category].join(" "));
    cards.set(s.id, { station: s, hay, li, statusEl, favBtn, playBtn });
    updateFavorite(s.id);
    updateCard(s.id);
    fragment.append(li);
  }
  $("grid").replaceChildren(fragment);
}

// Mostra/esconde cartões conforme pesquisa e filtro (sem recriar nada).
function applyFilters() {
  let visible = 0;
  for (const card of cards.values()) {
    const show = matches(card);
    card.li.hidden = !show;
    if (show) visible++;
  }
  $("empty").hidden = visible > 0;
  const noFavorites = filter === "fav" && !query;
  $("emptyTitle").textContent = noFavorites ? "Ainda não tem rádios favoritas." : "Nenhuma rádio encontrada.";
  $("emptyHint").textContent = noFavorites ? "Toque em ♡ numa rádio para a adicionar." : "Experimente outro nome, cidade, região ou categoria.";
  announceResults(visible);
}

// Anuncia o número de resultados ao leitor de ecrã, só depois de o utilizador parar de escrever.
let announceTimer;
let lastAnnounced = null;
function announceResults(visible) {
  clearTimeout(announceTimer);
  if (lastAnnounced === null) { lastAnnounced = visible; return; } // ao abrir a app não anuncia nada
  announceTimer = setTimeout(() => {
    if (visible === lastAnnounced) return;
    lastAnnounced = visible;
    $("resultsStatus").textContent = visible === 0 ? "Nenhuma rádio encontrada" : visible === 1 ? "1 rádio" : `${visible} rádios`;
  }, 600);
}

function toggleFavorite(id) {
  favorites.has(id) ? favorites.delete(id) : favorites.add(id);
  store.set("favorites", [...favorites]);
  updateFavorite(id);
  if (filter === "fav") applyFilters();
}

function updateFavorite(id) {
  const card = cards.get(id);
  if (!card) return;
  const isFav = favorites.has(id);
  card.favBtn.textContent = isFav ? "♥" : "♡";
  card.favBtn.setAttribute("aria-pressed", String(isFav));
  card.favBtn.setAttribute("aria-label", "Favorito: " + card.station.name); // nome fixo; o estado vem do aria-pressed
}

// Atualiza o estado do leitor num cartão (ativo, "EM DIRETO"/"A ligar…", botão Ouvir/Pausar).
function updateCard(id) {
  const card = cards.get(id);
  if (!card) return;
  const active = !!current && current.id === id;
  const busy = active && (status === "playing" || status === "loading");
  card.li.classList.toggle("active", active);
  card.statusEl.hidden = !busy;
  card.statusEl.className = active && status === "playing" ? "live" : "meta";
  card.statusEl.replaceChildren(...(active && status === "playing" ? [liveDot(), "EM DIRETO"] : ["A ligar…"]));
  card.playBtn.textContent = busy ? "⏸ Pausar" : "▶ Ouvir";
  card.playBtn.setAttribute("aria-label", (busy ? "Pausar " : "Ouvir ") + card.station.name);
}

// Chamado a cada mudança do leitor: só toca no cartão que deixou de estar ativo e no atual.
function updatePlayerCards() {
  const currentId = current ? current.id : null;
  if (shownActiveId && shownActiveId !== currentId) updateCard(shownActiveId);
  shownActiveId = currentId;
  if (currentId) updateCard(currentId);
}

$("search").addEventListener("input", (e) => { query = normalize(e.target.value.trim()); applyFilters(); });

/* ---------- Arranque ---------- */
applyTheme();
applyVolume();
renderFilters();
buildCards();
applyFilters();
const last = STATIONS.find((s) => s.id === store.get("lastStationId") && s.enabled);
if (last) { // mostra a última rádio no leitor, sem tocar automaticamente
  current = last;
  $("pName").textContent = last.name;
  paintAvatar($("pAvatar"), last);
}
setStatus(current ? "paused" : "idle");
if (current) $("pStatus").textContent = "Última rádio ouvida";

/* ---------- App instalável (PWA) ---------- */
// Só funciona via http(s); ao abrir o ficheiro com duplo clique é ignorado.
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
